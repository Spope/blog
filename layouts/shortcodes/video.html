{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $video := .Page.Resources.Get $src -}}
{{- if $video -}}
<div class="tile tile-video" data-src="{{ $video.RelPermalink }}" data-type="video" data-alt="{{ $alt }}">
  <video preload="metadata" muted playsinline>
    <source src="{{ $video.RelPermalink }}" type="video/mp4">
  </video>
  <div class="play-badge">▶ VIDEO</div>
</div>
{{- else -}}
  {{- warnf "video shortcode: file %q not found in page bundle" $src -}}
{{- end -}}
