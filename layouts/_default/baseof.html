<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ block "title" . }}{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ with .Params.Title }}{{ . }} — {{ end }}{{ .Site.Title }}{{ end }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/blog.css">
</head>
<body>
  {{ block "main" . }}{{ end }}

  <div id="lightbox" class="lightbox">
    <button class="lightbox-close">CLOSE · ESC</button>
    <button class="lightbox-nav lightbox-prev">←</button>
    <button class="lightbox-nav lightbox-next">→</button>
    <div class="lightbox-media-wrap"></div>
    <div class="lightbox-bottom">
      <div class="lightbox-caption"></div>
      <div class="lightbox-counter"></div>
    </div>
  </div>

  <script src="/js/blog.js"></script>
</body>
</html>
